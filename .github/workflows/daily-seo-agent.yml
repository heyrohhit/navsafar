name: Daily SEO/AEO/GEO/XOS Agent
on:
  schedule:
    - cron: '0 3 * * *'   # every day, 3AM UTC
  workflow_dispatch:

concurrency:
  group: seo-agent-daily
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Debug - check secret length (masked)
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "❌ Secret is EMPTY at workflow level"
          else
            echo "✅ Secret exists, length: ${#GEMINI_KEY}"
          fi
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run SEO agent
        run: node scripts/daily-seo-agent.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated pools
        run: |
          git config user.name "navsafar-seo-agent"
          git config user.email "seo-agent@navsafar.com"

          git add src/lib/seoKeywords.js src/lib/aeoFaqData.js docs/seo-agent-log.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily SEO/AEO/GEO/XOS agent update"

          # Pull latest changes and rebase before pushing to avoid conflicts
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}